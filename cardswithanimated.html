<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>cardswithanimated</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700&display=swap');
        @import url('https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.2.1/css/all.min.css');

        *,
        ::after,
        ::before {
        box-sizing: inherit;
        }

        body {
        font-family: 'Montserrat', sans-serif;
        background-color: #868383;
        }

        img {
        max-width: 100%;
        height: auto;
        box-sizing: border-box;
        vertical-align: middle;
        }

        .container {
        max-width: 1200px;
        margin: 0 auto;
        text-align: center;
        padding: 30px;
        }

        .container *,
        .container::after,
        .container::before {
          box-sizing: border-box;
        }

        .cards-grid-container {
        position: relative;
        overflow: hidden;
        }

        .cards-grid-wrapper {
        position: relative;
        width: 100%;
        height: 100%;
        z-index: 1;
        display: flex;
        transition-property: transform;
        box-sizing: content-box;
        justify-content: center;
        }

        .cards-grid-slide {
        flex-shrink: 0;
        width: 33%;
        height: 100%;
        position: relative;
        padding: 0 15px;
        }

        .card-item--inner {
        overflow: hidden;
        position: relative;
        border: 1px solid #e5e5e5;
        box-shadow: 0 2px 8px rgb(0 0 0 / 8%);
        border-radius: 3px;
        }

        .plx-item--holder {
        position: absolute;
        top: 0;
        bottom: 0;
        left: 50%;
        z-index: 1;
        padding: 20px;
        overflow: visible;
        transform: translateX(-50%)scaleX(0);
        transform-origin: center center;
        transition: 0.3s cubic-bezier(0.24, 0.74, 0.58, 1);
        opacity: 0;
        width: 100%;
        height: 100%;
        }

.card-item--inner:hover .plx-item--holder {
  transform: translateX(-50%)scaleX(1);
  opacity: 1;
}

.card-item--meta {
  background-color: #0b0b0b;
  width: 100%;
  height: 100%;
  padding: 20px;
  display: flex;
  align-items: center;
  flex-direction: column;
  text-align: center;
  justify-content: center;
}

.card-item--title {
  font-size: 18px;
  transform: translateY(8px);
  transition: all 200ms linear 0ms;
  opacity: 0;
  color: #fff;
  margin-bottom: 20px;
}

.card-item--inner:hover .card-item--title {
  transform: translateY(0);
  opacity: 1;
  transition-delay: 0.2s;
}

.card-item--position {
  transform: translateY(8px);
  transition: all 200ms linear 0ms;
  margin-bottom: 20px;
  opacity: 0;
  font-size: 12px;
  color: #fff;
}

.card-item--inner:hover .card-item--position {
  transform: translateY(0);
  opacity: 1;
  transition-delay: 0.3s;
}

.card-item--social {
  overflow: hidden;
}

.card-item--social a {
  display: inline-block;
  margin: 0 5px;
  color: #fff;
  font-size: 13px;
  transform: translateY(100%);
  transition: all 0.3s ease-in-out;
}

.card-item--inner:hover .card-item--social a {
  transform: translateY(0);
}

.card-item--inner:hover .card-item--social a:nth-child(1) {
  transition-delay: 0.4s;
}
footer{
  background-color: #333;
  color: #fff;
  position: fixed;
  bottom: 0;
  left: 0;
  padding: 8px 0;
  width: 100%;
  text-align: center;
}
    </style>
</head>
<body>
    <div class="container">
  <div class="cards-grid-container">
    <div class="cards-grid-wrapper">
      <div class="cards-grid-slide">
        <div class="card-item--inner">
          <div class="card-item--image">
            <img decoding="async" src="https://picsum.photos/600/800/?random=1" alt="team-9" title="team-9"></div>
          <div class="plx-item--holder">
            <div class="card-item--meta">
              <h4 class="card-item--title el-empty">Divyanshu Yadav</h4>
              <div class="card-item--position el-empty">Student</div>
              <div class="card-item--social">
                <a href="#" target="_blank"><i class="fa-brands fa-facebook"></i></a>
                <a href="#" target="_blank"><i class="fa-brands fa-twitter"></i></a>
                <a href="#" target="_blank"><i class="fa-brands fa-instagram"></i></a>
              </div>
            </div>
          </div>
        </div>
      </div>
      <div class="cards-grid-slide">
        <div class="card-item--inner">
          <div class="card-item--acimage">
            <img decoding="async" src="https://picsum.photos/600/800/?random=2" alt="team-1" title="team-1"></div>
          <div class="plx-item--holder">
            <div class="card-item--meta">
              <h4 class="card-item--title el-empty">Divyanshu Yadav</h4>
              <div class="card-item--position el-empty"> Engineer</div>
              <div class="card-item--social">
                <a href="#" target="_blank"><i class="fa-brands fa-facebook"></i></a>
                <a href="#" target="_blank"><i class="fa-brands fa-twitter"></i></a>
                <a href="#" target="_blank"><i class="fa-brands fa-instagram"></i></a>
              </div>
            </div>
          </div>
        </div>
      </div>
      <div class="cards-grid-slide">
        <div class="card-item--inner">
          <div class="card-item--image">
            <img decoding="async" src="https://picsum.photos/600/800/?random=3" alt="team-6" title="team-6"></div>
          <div class="plx-item--holder">
            <div class="card-item--meta">
              <h4 class="card-item--title el-empty">Divyanshu Yadav</h4>
              <div class="card-item--position el-empty"> Software Developer</div>
              <div class="card-item--social">
                <a href="#" target="_blank"><i class="fa-brands fa-facebook"></i></a>
                <a href="#" target="_blank"><i class="fa-brands fa-twitter"></i></a>
                <a href="#" target="_blank"><i class="fa-brands fa-instagram"></i></a>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
<footer>
  <p>&copy;2025 Divyanshu Yadav.All Right Reserved</p>
</footer>
    
</body>
</html>
